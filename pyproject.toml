[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexora-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.9,<2", "httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "asgi.py", "hexora_mcp"]
